services:
  db:
    image: pgvector/pgvector:pg16
    container_name: auralink-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: auralink
      POSTGRES_PASSWORD: changeme_local_only
      POSTGRES_DB: auralink
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - auralink_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auralink -d auralink"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  auralink_pgdata:
