[project]
name = "auralink-backend"
version = "0.1.0"
description = "Auralink - governed AI operations platform (backend)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "sqlalchemy[asyncio]==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",
    "pgvector==0.3.6",
    "pyjwt==2.10.1",
    "argon2-cffi==23.1.0",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "openai>=1.109,<2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "import-linter==2.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "core cannot import modules"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.modules", "app.adapters"]

[[tool.importlinter.contracts]]
name = "modules do not import each other's internals"
type = "forbidden"
source_modules = ["app.modules.agents"]
forbidden_modules = [
    "app.modules.knowledge.models",
    "app.modules.knowledge.repository",
    "app.modules.channels.models",
    "app.modules.channels.repository",
    "app.modules.tools.models",
    "app.modules.tools.repository",
]

[[tool.importlinter.contracts]]
name = "adapters do not import modules"
type = "forbidden"
source_modules = ["app.adapters"]
forbidden_modules = ["app.modules"]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["py.typed"]