# Alembic configuration for Auralink.
#
# sqlalchemy.url is deliberately empty: migrations must not read it from here.
# env.py loads the owner-role URL from Settings.ALEMBIC_DATABASE_URL so there is
# one source of truth and no chance of running a migration on the runtime role.
#
# Logging in migrations uses the application logger via env.py; Alembic's own
# config here is minimal on purpose.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# The following is set by env.py from Settings.ALEMBIC_DATABASE_URL.
sqlalchemy.url =

# Alembic logging config. Kept minimal; application logging is configured in
# app.core.logging. Do NOT add handlers here that would double-emit.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
